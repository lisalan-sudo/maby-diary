```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>人间编年</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

<style>

/* =====================================================
   人间编年 V3
===================================================== */

:root{

--bg:#161311;
--paper:#221D1A;
--paper2:#2E2621;

--text:#F2E8DC;
--text2:#B7A99B;
--text3:#7C7067;

--accent:#8FAE8E;
--accentSoft:#2D3830;

--border:#3A312B;

--shadow:0 18px 50px rgba(0,0,0,.45);

--radius:26px;

}

/* =====================================================
   四主题
===================================================== */

body.theme-songyan{

--bg:#161311;
--paper:#221D1A;
--paper2:#2E2621;

--text:#F2E8DC;
--text2:#B7A99B;
--text3:#7C7067;

--accent:#8FAE8E;
--accentSoft:#2D3830;

--border:#3A312B;

}

body.theme-xuanzhi{

--bg:#F8F4EC;
--paper:#EFE7DA;
--paper2:#E4D7C3;

--text:#2B2622;
--text2:#6D6257;
--text3:#9A8C7D;

--accent:#A56A4F;
--accentSoft:#E8D7C8;

--border:#D9CCB8;

}

body.theme-yanzhi{

--bg:#2A1E22;
--paper:#3A2A2F;
--paper2:#49353B;

--text:#F8EDEE;
--text2:#D5B8BE;
--text3:#A7858E;

--accent:#E09AB0;
--accentSoft:#5B3B46;

--border:#6A4C56;

}

body.theme-qingjian{

--bg:#182022;
--paper:#233034;
--paper2:#2E4045;

--text:#E6EFE8;
--text2:#A8B9B0;
--text3:#72847B;

--accent:#7FA89A;
--accentSoft:#31454A;

--border:#395056;

}

/* =====================================================
   全局
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
height:100%;
}

body{

background:var(--bg);
color:var(--text);
font-family:'Noto Sans SC',sans-serif;
overflow:hidden;
position:relative;
transition:.35s;

}

/* =====================================================
   中国风暗纹
===================================================== */

body::before{

content:'';
position:fixed;
inset:0;
pointer-events:none;
opacity:.12;

background-size:500px;

}

body.theme-songyan::before{
background-image:
radial-gradient(circle at 20% 20%, rgba(143,174,142,.12), transparent 22%),
radial-gradient(circle at 80% 80%, rgba(143,174,142,.08), transparent 22%),
linear-gradient(45deg, transparent 48%, rgba(255,255,255,.02) 49%, transparent 51%);
}

body.theme-xuanzhi::before{
background-image:
radial-gradient(circle at 20% 20%, rgba(165,106,79,.08), transparent 20%),
linear-gradient(90deg, rgba(0,0,0,.02) 1px, transparent 1px),
linear-gradient(rgba(0,0,0,.015) 1px, transparent 1px);
background-size:220px 220px;
}

body.theme-yanzhi::before{
background-image:
radial-gradient(circle at 50% 50%, rgba(224,154,176,.08), transparent 25%),
linear-gradient(45deg, transparent 48%, rgba(255,255,255,.03) 49%, transparent 51%);
}

body.theme-qingjian::before{
background-image:
linear-gradient(90deg, rgba(127,168,154,.03) 1px, transparent 1px),
radial-gradient(circle at 20% 20%, rgba(127,168,154,.08), transparent 22%);
background-size:160px 160px;
}

/* =====================================================
   顶栏
===================================================== */

header{

min-height:96px;

padding:16px 20px;

border-bottom:1px solid var(--border);

background:rgba(255,255,255,.02);

backdrop-filter:blur(10px);

position:sticky;
top:0;
z-index:50;

}

.header-inner{

display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;

}

.logo{

font-family:'Ma Shan Zheng',serif;
font-size:52px;
line-height:1.2;
color:var(--accent);

}

.logo-sub{
margin-top:4px;
font-size:14px;
color:var(--text2);
}

.theme-wrap{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:flex-end;
}

.theme-btn{

border:none;
background:var(--paper);
border:1px solid var(--border);

padding:10px 18px;

border-radius:999px;

cursor:pointer;

color:var(--text2);

}

/* =====================================================
   主布局
===================================================== */

.layout{

display:grid;
grid-template-columns:360px 1fr;

height:calc(100vh - 96px);

}

.sidebar{

border-right:1px solid var(--border);
padding:22px;
overflow-y:auto;

}

.main{

padding:28px;
overflow-y:auto;
padding-bottom:140px;

}

/* =====================================================
   卡片
===================================================== */

.panel,
.card{

background:var(--paper);
border:1px solid var(--border);
border-radius:var(--radius);
box-shadow:var(--shadow);

}

.panel{
padding:20px;
}

.card{
padding:24px;
margin-bottom:20px;
}

/* =====================================================
   日历
===================================================== */

.calendar-head{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

}

.calendar-title{
font-family:'Ma Shan Zheng';
font-size:40px;
color:var(--accent);
}

.cal-btn{

width:42px;
height:42px;

border-radius:50%;

border:none;

background:var(--bg);
color:var(--text);

cursor:pointer;

}

.week-row,
.calendar-grid{

display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;

}

.week-row{
margin-bottom:10px;
}

.week-row div{
text-align:center;
color:var(--text3);
}

.day{

aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;

border-radius:14px;

cursor:pointer;

position:relative;

transition:.2s;

}

.day:hover{
background:var(--accentSoft);
}

.day.selected{
background:var(--accent);
color:white;
font-weight:bold;
}

.day.today{
border:2px solid var(--accent);
}

.day.has-entry::after{

content:'';

width:6px;
height:6px;

border-radius:50%;
background:var(--accent);

position:absolute;
bottom:6px;

}

/* =====================================================
   今日史官
===================================================== */

.quote{

padding:22px;
margin-bottom:26px;

background:var(--accentSoft);

border:1px dashed var(--accent);

border-radius:24px;

}

.quote-title{
color:var(--accent);
margin-bottom:12px;
}

.quote-text{
font-family:'Noto Serif SC',serif;
font-size:18px;
line-height:2;
color:var(--text2);
}

/* =====================================================
   日期
===================================================== */

.date-box{
text-align:center;
margin-bottom:28px;
}

.date-box h1{
font-family:'Ma Shan Zheng';
font-size:72px;
color:var(--accent);
line-height:1.2;
}

.date-box p{
margin-top:8px;
color:var(--text2);
}

/* =====================================================
   输入
===================================================== */

.label{
margin-bottom:14px;
color:var(--text2);
}

textarea,
input{

width:100%;

background:none;
border:none;
outline:none;

font-family:'Noto Serif SC',serif;

font-size:16px;
line-height:2;

color:var(--text);

}

textarea{
min-height:120px;
resize:vertical;
}

::placeholder{
color:var(--text3);
}

/* =====================================================
   按钮
===================================================== */

.actions{

display:flex;
gap:16px;
margin-top:24px;

}

.btn{

flex:1;

border:none;

padding:18px;

border-radius:20px;

cursor:pointer;

font-size:16px;
font-weight:700;

}

.btn-primary{
background:var(--accent);
color:white;
}

.btn-secondary{
background:var(--paper2);
color:var(--text2);
}

/* =====================================================
   手机
===================================================== */

@media(max-width:980px){

.layout{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.logo{
font-size:42px;
}

.date-box h1{
font-size:52px;
}

.main{
padding:18px;
}

.actions{
flex-direction:column;
}

}

</style>
</head>
<body class="theme-songyan">

<header>
<div class="header-inner">

<div>
<div class="logo">人间编年</div>
<div class="logo-sub">不是世界史，而是我的人间史</div>
</div>

<div class="theme-wrap">
<button class="theme-btn" onclick="setTheme('xuanzhi')">宣纸</button>
<button class="theme-btn" onclick="setTheme('songyan')">松烟</button>
<button class="theme-btn" onclick="setTheme('yanzhi')">胭脂</button>
<button class="theme-btn" onclick="setTheme('qingjian')">青简</button>
</div>

</div>
</header>

<div class="layout">

<aside class="sidebar">

<div class="panel">

<div class="calendar-head">
<button class="cal-btn" onclick="changeMonth(-1)">‹</button>
<div class="calendar-title" id="monthTitle"></div>
<button class="cal-btn" onclick="changeMonth(1)">›</button>
</div>

<div class="week-row">
<div>日</div>
<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
</div>

<div class="calendar-grid" id="calendarGrid"></div>

</div>

</aside>

<main class="main">

<div class="quote">
<div class="quote-title">✦ 今日史官</div>
<div class="quote-text" id="dailyQuote"></div>
</div>

<div class="date-box">
<h1 id="mainDate"></h1>
<p id="subDate"></p>
</div>

<div class="card">
<div class="label">☀️ 坊间见闻</div>
<textarea id="events" placeholder="今日市井之间，有何可记？"></textarea>
</div>

<div class="card">
<div class="label">📚 案头博览</div>
<textarea id="reading" placeholder="今日翻阅了哪些卷册？"></textarea>
</div>

<div class="card">
<div class="label">🧊 考据心得</div>
<textarea id="trivia" placeholder="记录一则掌故、冷知识……"></textarea>
</div>

<div class="card">
<div class="label">💡 奇思脑洞</div>
<textarea id="brainstorm" placeholder="若历史拐向另一条河流……"></textarea>
</div>

<div class="actions">
<button class="btn btn-primary" onclick="saveEntry()">💾 载入史册</button>
<button class="btn btn-secondary" onclick="exportMarkdown()">📜 誊录</button>
</div>

</main>

</div>

<script>

/* =====================================================
   今日史官
===================================================== */

const QUOTES = [

'万历十五年无大事，今日亦然。',
'长安米贵，居大不易，而今日咖啡亦涨价。',
'历史从不是宏大叙事，它只是千万人的今日。',
'古人记山河，今人记地铁与深夜便利店。',
'所有未被记下的生活，终将沉入岁月。',
'窗外车流不息，恰如旧时长安夜市。',
'所谓人生，不过是把寻常日子写成长卷。'

];

function setDailyQuote(){

const today = new Date().toDateString();

let seed = 0;

for(let i=0;i<today.length;i++){
seed += today.charCodeAt(i);
}

const q = QUOTES[seed % QUOTES.length];

document.getElementById('dailyQuote').innerText = q;

}

/* =====================================================
   日期
===================================================== */

let selectedDate = new Date();
let currentMonth = new Date();

const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function formatDate(date){

return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

}

function updateDate(){

const d = selectedDate;

mainDate.innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

subDate.innerText = weeks[d.getDay()];

}

/* =====================================================
   存储系统
===================================================== */

function getEntries(){

return JSON.parse(localStorage.getItem('renjian_entries') || '{}');

}

function saveEntries(data){

localStorage.setItem('renjian_entries', JSON.stringify(data));

}

function loadEntry(){

const entries = getEntries();

const key = formatDate(selectedDate);

const entry = entries[key];

if(entry){

events.value = entry.events || '';
reading.value = entry.reading || '';
trivia.value = entry.trivia || '';
brainstorm.value = entry.brainstorm || '';

}else{

events.value = '';
reading.value = '';
trivia.value = '';
brainstorm.value = '';

}

}

function saveEntry(){

const entries = getEntries();

const key = formatDate(selectedDate);

entries[key] = {

events:events.value,
reading:reading.value,
trivia:trivia.value,
brainstorm:brainstorm.value

};

saveEntries(entries);

alert('已载入史册');

renderCalendar();

}

/* =====================================================
   Markdown 导出
===================================================== */

function exportMarkdown(){

const key = formatDate(selectedDate);

const md =
`# ${key}

## 坊间见闻
${events.value}

## 案头博览
${reading.value}

## 考据心得
${trivia.value}

## 奇思脑洞
${brainstorm.value}
`;

const blob = new Blob([md], {type:'text/markdown'});

const url = URL.createObjectURL(blob);

const a = document.createElement('a');

a.href = url;
a.download = `${key}-人间编年.md`;

a.click();

URL.revokeObjectURL(url);

}

/* =====================================================
   日历
===================================================== */

function renderCalendar(){

calendarGrid.innerHTML = '';

const year = currentMonth.getFullYear();
const month = currentMonth.getMonth();

monthTitle.innerText = `${year}年 ${month+1}月`;

const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month+1, 0).getDate();

const entries = getEntries();

for(let i=0;i<firstDay;i++){

const empty = document.createElement('div');
calendarGrid.appendChild(empty);

}

for(let i=1;i<=lastDate;i++){

const date = new Date(year, month, i);

const div = document.createElement('div');

const key = formatDate(date);

div.className = 'day';

if(entries[key]){
div.classList.add('has-entry');
}

if(date.toDateString() === new Date().toDateString()){
div.classList.add('today');
}

if(date.toDateString() === selectedDate.toDateString()){
div.classList.add('selected');
}

div.innerText = i;

div.onclick = ()=>{

selectedDate = date;

updateDate();
loadEntry();
renderCalendar();

};

calendarGrid.appendChild(div);

}

}

function changeMonth(step){

currentMonth.setMonth(currentMonth.getMonth() + step);

renderCalendar();

}

/* =====================================================
   主题
===================================================== */

function setTheme(theme){

body.className = `theme-${theme}`;

localStorage.setItem('renjian_theme', theme);

}

/* =====================================================
   初始化
===================================================== */

function init(){

const savedTheme = localStorage.getItem('renjian_theme') || 'songyan';

body.className = `theme-${savedTheme}`;

setDailyQuote();

updateDate();

loadEntry();

renderCalendar();

}

init();

</script>

</body>
</html>
```
