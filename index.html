<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>人间编年</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#151210;
--paper:#211c19;
--paper2:#2c2521;
--text:#f0e6db;
--text2:#b7a99b;
--text3:#776a61;
--accent:#93b09a;
--accentSoft:#29342e;
--border:#3a312b;
--shadow:0 10px 40px rgba(0,0,0,.25);
}

body{
background:var(--bg);
color:var(--text);
font-family:'Noto Sans SC',sans-serif;
overflow-x:hidden;
position:relative;
}

body::before{
content:'';
position:fixed;
inset:0;
pointer-events:none;
opacity:.12;
z-index:-1;
background-image:
radial-gradient(circle at 20% 20%, rgba(255,255,255,.05), transparent 30%),
radial-gradient(circle at 80% 80%, rgba(255,255,255,.04), transparent 30%);
}

header{
padding:24px;
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
border-bottom:1px solid var(--border);
}

.logo{
font-family:'Ma Shan Zheng';
font-size:58px;
color:var(--accent);
line-height:1.1;
}

.logo-sub{
margin-top:10px;
color:var(--text2);
font-size:15px;
}

.layout{
display:grid;
grid-template-columns:320px 1fr;
min-height:calc(100vh - 120px);
}

.sidebar{
padding:24px;
border-right:1px solid var(--border);
}

.main{
padding:28px;
}

.panel,.card,.quote,.time-scroll{
background:rgba(255,255,255,.02);
border:1px solid var(--border);
border-radius:28px;
backdrop-filter:blur(10px);
box-shadow:var(--shadow);
}

.panel{
padding:24px;
}

.card{
padding:24px;
margin-bottom:22px;
}

.quote{
padding:24px;
margin-bottom:28px;
position:relative;
overflow:hidden;
}

.quote::after{
content:'史';
position:absolute;
right:20px;
bottom:-10px;
font-size:120px;
opacity:.04;
font-family:'Ma Shan Zheng';
}

.quote-title{
color:var(--accent);
margin-bottom:14px;
}

.quote-text{
font-family:'Noto Serif SC';
font-size:18px;
line-height:2;
color:var(--text2);
}

.calendar-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.calendar-title{
font-family:'Ma Shan Zheng';
font-size:40px;
color:var(--accent);
}

.cal-btn{
width:42px;
height:42px;
border-radius:50%;
border:none;
background:var(--paper2);
color:var(--text);
cursor:pointer;
}

.week-row,.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.week-row{
margin-bottom:10px;
}

.week-row div{
text-align:center;
color:var(--text3);
}

.day{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
cursor:pointer;
position:relative;
transition:.2s;
}

.day:hover{
background:var(--accentSoft);
transform:translateY(-2px);
}

.day.today{
border:2px solid var(--accent);
}

.day.selected{
background:var(--accent);
color:#fff;
font-weight:bold;
}

.day.has-entry::after{
content:'';
width:6px;
height:6px;
background:var(--accent);
border-radius:50%;
position:absolute;
bottom:5px;
}

.time-scroll{
padding:28px;
margin-bottom:28px;
position:relative;
overflow:hidden;
}

.time-scroll::before{
content:'人间卷宗';
position:absolute;
top:20px;
right:24px;
font-family:'Ma Shan Zheng';
font-size:32px;
opacity:.08;
}

.time-line{
display:flex;
flex-direction:column;
gap:18px;
}

.time-item{
display:flex;
gap:18px;
align-items:flex-start;
padding-bottom:16px;
border-bottom:1px dashed rgba(255,255,255,.06);
}

.time-label{
width:88px;
flex-shrink:0;
color:var(--text3);
font-size:14px;
letter-spacing:2px;
}

.time-content{
flex:1;
}

.time-main{
font-size:20px;
font-family:'Noto Serif SC';
line-height:1.8;
}

.time-sub{
margin-top:4px;
color:var(--text3);
font-size:13px;
}

.date-box{
text-align:center;
margin-bottom:36px;
}

.date-box h1{
font-family:'Ma Shan Zheng';
font-size:74px;
color:var(--accent);
}

.date-box p{
margin-top:10px;
color:var(--text2);
}

.label{
margin-bottom:12px;
color:var(--text2);
}

textarea{
width:100%;
background:none;
border:none;
outline:none;
resize:vertical;
min-height:120px;
font-family:'Noto Serif SC';
font-size:16px;
line-height:2;
color:var(--text);
}

::placeholder{
color:var(--text3);
}

.actions{
display:flex;
gap:16px;
margin-top:24px;
}

.btn{
flex:1;
border:none;
padding:18px;
border-radius:20px;
cursor:pointer;
font-size:16px;
font-weight:700;
transition:.25s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-primary{
background:var(--accent);
color:#fff;
}

.btn-secondary{
background:var(--paper2);
color:var(--text2);
}

.phase-input{
margin-top:12px;
width:100%;
padding:14px;
background:var(--paper2);
border:1px solid var(--border);
border-radius:16px;
color:var(--text);
font-size:15px;
}

@media(max-width:980px){

.layout{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.logo{
font-size:42px;
}

.main{
padding:18px;
}

.actions{
flex-direction:column;
}

.date-box h1{
font-size:56px;
}

.time-main{
font-size:17px;
}

}

</style>
</head>

<body>

<header>

<div>
<div class="logo">人间编年</div>
<div class="logo-sub">不是世界史，而是我的人间史</div>
</div>

</header>

<div class="layout">

<aside class="sidebar">

<div class="panel">

<div class="calendar-head">
<button class="cal-btn" onclick="changeMonth(-1)">‹</button>
<div class="calendar-title" id="monthTitle"></div>
<button class="cal-btn" onclick="changeMonth(1)">›</button>
</div>

<div class="week-row">
<div>日</div>
<div>一</div>
<div>二</div>
<div>三</div>
<div>四</div>
<div>五</div>
<div>六</div>
</div>

<div class="calendar-grid" id="calendarGrid"></div>

</div>

</aside>

<main class="main">

<div class="quote">
<div class="quote-title">✦ 今日史官</div>
<div class="quote-text" id="dailyQuote"></div>
</div>

<div class="time-scroll">

<div class="time-line">

<div class="time-item">
<div class="time-label">公历</div>
<div class="time-content">
<div class="time-main" id="solarDate"></div>
<div class="time-sub">现实世界正在流动</div>
</div>
</div>

<div class="time-item">
<div class="time-label">时令</div>
<div class="time-content">
<div class="time-main" id="lunarDate"></div>
<div class="time-sub">东方时间仍在缓慢运转</div>
</div>
</div>

<div class="time-item">
<div class="time-label">人间历</div>
<div class="time-content">
<div class="time-main" id="lifeDays"></div>
<div class="time-sub">自初临人世起，已走过的岁月</div>
</div>
</div>

<div class="time-item">
<div class="time-label">人生阶段</div>
<div class="time-content">
<div class="time-main" id="lifePhase"></div>
<div class="time-sub">此刻的人生章节</div>
</div>
</div>

<div class="time-item">
<div class="time-label">本年已载</div>
<div class="time-content">
<div class="time-main" id="yearEntries"></div>
<div class="time-sub">已经誊入史册的篇章</div>
</div>
</div>

</div>

<input
class="phase-input"
id="phaseInput"
placeholder="例如：芝加哥初春纪 · 第17日"
/>

</div>

<div class="date-box">
<h1 id="mainDate"></h1>
<p id="subDate"></p>
</div>

<div class="card">
<div class="label">☀️ 坊间见闻</div>
<textarea id="events" placeholder="今日市井之间，有何可记？"></textarea>
</div>

<div class="card">
<div class="label">📚 案头博览</div>
<textarea id="reading" placeholder="今日翻阅了哪些卷册？"></textarea>
</div>

<div class="card">
<div class="label">🧊 考据心得</div>
<textarea id="trivia" placeholder="记录一则掌故、冷知识……"></textarea>
</div>

<div class="card">
<div class="label">💡 奇思脑洞</div>
<textarea id="brainstorm" placeholder="若历史拐向另一条河流……"></textarea>
</div>

<div class="actions">
<button class="btn btn-primary" onclick="saveEntry()">💾 载入史册</button>
<button class="btn btn-secondary" onclick="exportMarkdown()">📜 誊录</button>
</div>

</main>

</div>

<script>

const QUOTES = [
'所谓人生，不过是把寻常日子写成长卷。',
'所有未被记下的生活，终将沉入岁月。',
'古人记山河，今人记地铁与深夜便利店。',
'历史从不是宏大叙事，它只是千万人的今日。',
'窗外车流不息，恰如旧时长安夜市。'
];

const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

let selectedDate = new Date();
let currentMonth = new Date();

function formatDate(date){
return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function setDailyQuote(){

const today = new Date().toDateString();

let seed = 0;

for(let i=0;i<today.length;i++){
seed += today.charCodeAt(i);
}

document.getElementById('dailyQuote').innerText =
QUOTES[seed % QUOTES.length];

}

function updateDate(){

document.getElementById('mainDate').innerText =
`${selectedDate.getMonth()+1}月${selectedDate.getDate()}日`;

document.getElementById('subDate').innerText =
`${selectedDate.getFullYear()}年 · ${weeks[selectedDate.getDay()]}`;

document.getElementById('solarDate').innerText =
`${selectedDate.getFullYear()}年${selectedDate.getMonth()+1}月${selectedDate.getDate()}日 ${weeks[selectedDate.getDay()]}`;

document.getElementById('lunarDate').innerText =
'乙巳年 · 立夏后三日';

const birthday = new Date('1997-01-01');

const days =
Math.floor((selectedDate - birthday)/(1000*60*60*24));

document.getElementById('lifeDays').innerText =
`第 ${days.toLocaleString()} 日`;

const phase =
localStorage.getItem('renjian_phase') ||
'尚未命名的人生章节';

document.getElementById('lifePhase').innerText = phase;

const entries = getEntries();

const currentYear = selectedDate.getFullYear();

const count =
Object.keys(entries).filter(key=>key.startsWith(currentYear)).length;

document.getElementById('yearEntries').innerText =
`${count} 篇`;

}

function getEntries(){
return JSON.parse(localStorage.getItem('renjian_entries') || '{}');
}

function saveEntries(data){
localStorage.setItem('renjian_entries', JSON.stringify(data));
}

function loadEntry(){

const entries = getEntries();

const key = formatDate(selectedDate);

const entry = entries[key];

document.getElementById('events').value =
entry?.events || '';

document.getElementById('reading').value =
entry?.reading || '';

document.getElementById('trivia').value =
entry?.trivia || '';

document.getElementById('brainstorm').value =
entry?.brainstorm || '';

}

function saveEntry(){

const entries = getEntries();

const key = formatDate(selectedDate);

entries[key] = {
events:document.getElementById('events').value,
reading:document.getElementById('reading').value,
trivia:document.getElementById('trivia').value,
brainstorm:document.getElementById('brainstorm').value
};

saveEntries(entries);

const phase =
document.getElementById('phaseInput').value;

if(phase){
localStorage.setItem('renjian_phase', phase);
}

updateDate();

renderCalendar();

alert('已誊入此年卷宗');

}

function exportMarkdown(){

const key = formatDate(selectedDate);

const markdown = `
# 人间编年

## 公历
${document.getElementById('solarDate').innerText}

## 时令
${document.getElementById('lunarDate').innerText}

## 人间历
${document.getElementById('lifeDays').innerText}

## 人生阶段
${document.getElementById('lifePhase').innerText}

---

## 坊间见闻
${document.getElementById('events').value}

## 案头博览
${document.getElementById('reading').value}

## 考据心得
${document.getElementById('trivia').value}

## 奇思脑洞
${document.getElementById('brainstorm').value}
`;

const blob = new Blob([markdown], {type:'text/markdown'});

const url = URL.createObjectURL(blob);

const a = document.createElement('a');

a.href = url;

a.download = `${key}-人间编年.md`;

a.click();

URL.revokeObjectURL(url);

}

function renderCalendar(){

const grid = document.getElementById('calendarGrid');

grid.innerHTML = '';

const year = currentMonth.getFullYear();

const month = currentMonth.getMonth();

document.getElementById('monthTitle').innerText =
`${year}年 ${month+1}月`;

const firstDay =
new Date(year, month, 1).getDay();

const lastDate =
new Date(year, month+1, 0).getDate();

const entries = getEntries();

for(let i=0;i<firstDay;i++){

const empty = document.createElement('div');

grid.appendChild(empty);

}

for(let i=1;i<=lastDate;i++){

const date = new Date(year, month, i);

const div = document.createElement('div');

div.className = 'day';

const key = formatDate(date);

if(entries[key]) div.classList.add('has-entry');

if(date.toDateString() === new Date().toDateString()){
div.classList.add('today');
}

if(date.toDateString() === selectedDate.toDateString()){
div.classList.add('selected');
}

div.innerText = i;

div.onclick = ()=>{

selectedDate = date;

updateDate();

loadEntry();

renderCalendar();

};

grid.appendChild(div);

}

}

function changeMonth(step){

currentMonth.setMonth(currentMonth.getMonth() + step);

renderCalendar();

}

function init(){

setDailyQuote();

updateDate();

loadEntry();

renderCalendar();

const savedPhase =
localStorage.getItem('renjian_phase');

if(savedPhase){
document.getElementById('phaseInput').value = savedPhase;
}

}

init();

</script>

</body>
</html>
