<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马伯庸日记 📖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   设计语言：「纸上烟云」
   柔和奶茶色 + 毛笔字标题 + 水彩晕染背景
══════════════════════════════════════════ */
:root {
  --cream:    #FAF7F2;
  --paper:    #F3EDE3;
  --paper2:   #EDE4D5;
  --ink:      #2D2520;
  --ink2:     #6B5D54;
  --ink3:     #A8978C;
  --rose:     #C4748A;
  --rose-l:   #F0D4DC;
  --rose-bg:  #FBF0F3;
  --teal:     #4A8C7E;
  --teal-l:   #C8E5DF;
  --teal-bg:  #EEF8F5;
  --amber:    #B5813A;
  --amber-l:  #F2E2C0;
  --amber-bg: #FDF6E8;
  --border:   #DDD3C5;
  --r:        12px;
  --r-lg:     18px;
  --shadow:   0 2px 16px rgba(100,80,60,0.10);
}

/* ══ 主题切换 ══ */
body.theme-paper { /* 默认 */ }
body.theme-sakura {
  --cream:    #FFF5F7; --paper:  #FFE8EE; --paper2: #FFD6E0;
  --ink:      #3D1A24; --ink2:   #7A4055; --ink3:   #B87A90;
  --rose:     #E05C8A; --rose-l: #FFB8CC; --rose-bg:#FFF0F4;
  --border:   #FFCDD7;
}
body.theme-business {
  --cream:    #F4F7FA; --paper:  #E8EEF5; --paper2: #D8E4EF;
  --ink:      #1A2535; --ink2:   #3D5068; --ink3:   #7A93AD;
  --rose:     #2B6CB0; --rose-l: #BEE3F8; --rose-bg:#EBF8FF;
  --border:   #CBD5E0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; position: relative; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at 10% 20%, rgba(196,116,138,0.05) 0%, transparent 50%),
              radial-gradient(ellipse at 90% 80%, rgba(74,140,126,0.05) 0%, transparent 50%);
}

header { position: sticky; top: 0; z-index: 100; background: rgba(250,247,242,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: 'Ma Shan Zheng', serif; font-size: 22px; color: var(--rose); display: flex; align-items: center; gap: 8px; }

nav { display: flex; justify-content: center; gap: 4px; padding: 12px 24px; position: relative; z-index: 1; }
.nav-btn { padding: 7px 18px; border-radius: 20px; border: 1px solid transparent; background: none; cursor: pointer; font-size: 14px; color: var(--ink2); transition: all 0.2s; }
.nav-btn.active { background: var(--paper); border-color: var(--border); color: var(--rose); font-weight: 500; }

main { max-width: 780px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
.page { display: none; animation: fadeUp 0.3s ease; }
.page.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); position: relative; }
.label { font-size: 12px; color: var(--ink3); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

textarea, input { width: 100%; border: 1px solid var(--border); border-radius: var(--r); padding: 10px; font-size: 14px; background: var(--cream); color: var(--ink); line-height: 1.6; }
textarea:focus, input:focus { outline: none; border-color: var(--rose); }

.btn { cursor: pointer; border-radius: var(--r); border: 1px solid var(--border); padding: 8px 16px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--rose); color: #fff; border: none; width: 100%; justify-content: center; padding: 12px; font-weight: 600; box-shadow: 0 4px 12px rgba(196,116,138,0.2); }

/* 日历增强样式 */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.cal-day:hover { background: var(--rose-bg); color: var(--rose); transform: scale(1.1); }
.cal-day.today { border: 2px solid var(--rose); font-weight: bold; }
.cal-day.has-entry { background: var(--rose-l); color: var(--rose); font-weight: 600; }
.cal-day.other { opacity: 0.3; cursor: default; }

.modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
.modal-mask.open { display: flex; }
.modal-box { background: var(--paper); padding: 24px; border-radius: var(--r-lg); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
</style>
</head>
<body class="theme-paper">

<header>
  <div class="logo">📖 <span>马伯庸日记</span></div>
  <div class="theme-switcher" style="display:flex; gap:8px;">
    <div style="width:18px;height:18px;border-radius:50%;background:#F3EDE3;cursor:pointer;border:1px solid #ddd" onclick="setTheme('paper')"></div>
    <div style="width:18px;height:18px;border-radius:50%;background:#FFE8EE;cursor:pointer;border:1px solid #ddd" onclick="setTheme('sakura')"></div>
    <div style="width:18px;height:18px;border-radius:50%;background:#E8EEF5;cursor:pointer;border:1px solid #ddd" onclick="setTheme('business')"></div>
  </div>
</header>

<nav>
  <button class="nav-btn active" onclick="switchPage('write', this)">✍️ 起居注</button>
  <button class="nav-btn" onclick="switchPage('history', this)">📅 编年史</button>
  <button class="nav-btn" onclick="switchPage('vocab', this)">⭐ 采风本</button>
</nav>

<main>
  <div class="page active" id="page-write">
    <div style="text-align:center; margin-bottom:20px;">
      <h1 id="date-main" style="font-family:'Ma Shan Zheng'; color:var(--rose); font-size:28px;"></h1>
      <p id="date-sub" style="font-size:12px; color:var(--ink3); letter-spacing:2px;"></p>
    </div>

    <div class="card">
      <div class="label">☀️ 坊间见闻（发生了什么）</div>
      <textarea id="events" rows="3" placeholder="今日市井之间，有何奇遇？"></textarea>
    </div>

    <div class="card">
      <div class="label">📚 案头博览（读了什么书）</div>
      <textarea id="reading" rows="2" placeholder="翻开哪卷经史子集？"></textarea>
    </div>

    <div class="card">
        <div class="label">🧊 考据心得（今日冷知识）</div>
        <input type="text" id="trivia-in" placeholder="记录一个不为人知的细节...">
    </div>

    <div class="card">
        <div class="label">💡 奇思脑洞（如果...会怎样）</div>
        <input type="text" id="brainstorm-in" placeholder="给历史或生活开个洞...">
    </div>

    <button class="btn btn-primary" onclick="generate()">🪄 研墨挥毫（AI润色）</button>
    <button class="btn" onclick="saveEntry()" style="width:100%; margin-top:10px; justify-content:center;">💾 载入史册</button>

    <div id="result-wrap" style="display:none; margin-top:20px;">
        <div class="card" style="background:var(--rose-bg); border-color:var(--rose-l);">
            <div class="label" id="result-meta" style="color:var(--rose)">✦ 稿件预览</div>
            <div id="result-text" style="font-family:'Noto Serif SC'; line-height:2; white-space:pre-wrap;"></div>
        </div>
    </div>
  </div>

  <div class="page" id="page-history">
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
        <button onclick="changeMonth(-1)" class="btn">‹</button>
        <h3 id="cal-month-label" style="font-family:'Ma Shan Zheng'"></h3>
        <button onclick="changeMonth(1)" class="btn">›</button>
      </div>
      <div class="cal-grid" id="cal-grid">
        <div class="cal-day other">日</div><div class="cal-day other">一</div><div class="cal-day other">二</div>
        <div class="cal-day other">三</div><div class="cal-day other">四</div><div class="cal-day other">五</div><div class="cal-day other">六</div>
      </div>
    </div>
    <div id="entry-list" style="margin-top:20px;"></div>
  </div>

  </main>

<script>
/* ════ 数据存储 ════ */
const STORAGE = {
  get: (k) => JSON.parse(localStorage.getItem('maby_'+k) || '[]'),
  set: (k, v) => localStorage.setItem('maby_'+k, JSON.stringify(v))
};

let currentEditDate = formatDate(new Date()); // 核心指针
let viewDate = new Date(); // 日历查看日期

/* ════ 初始化 ════ */
function init() {
  updateDateUI(currentEditDate);
  loadEntryByDate(currentEditDate);
  renderCalendar();
}

/* ════ 核心函数 ════ */
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function updateDateUI(dateStr) {
  const d = new Date(dateStr);
  const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('date-main').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  document.getElementById('date-sub').textContent = weeks[d.getDay()];
}

function switchPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');
  if(id === 'history') renderCalendar();
}

function loadEntryByDate(dateStr) {
  const entries = STORAGE.get('entries');
  const e = entries.find(item => item.date === dateStr);
  
  // 清空
  document.getElementById('events').value = e ? e.events : '';
  document.getElementById('reading').value = e ? e.reading : '';
  document.getElementById('trivia-in').value = e ? e.trivia : '';
  document.getElementById('brainstorm-in').value = e ? e.brainstorm : '';
  
  if (e && (e.ai_history || e.ai_humor)) {
      document.getElementById('result-wrap').style.display = 'block';
      document.getElementById('result-text').textContent = e.ai_history || e.ai_humor;
  } else {
      document.getElementById('result-wrap').style.display = 'none';
  }
}

function saveEntry() {
  const entries = STORAGE.get('entries');
  const newData = {
    date: currentEditDate,
    events: document.getElementById('events').value,
    reading: document.getElementById('reading').value,
    trivia: document.getElementById('trivia-in').value,
    brainstorm: document.getElementById('brainstorm-in').value,
    ai_history: document.getElementById('result-text').textContent
  };

  const idx = entries.findIndex(item => item.date === currentEditDate);
  if(idx > -1) entries[idx] = newData;
  else entries.unshift(newData);

  STORAGE.set('entries', entries);
  alert('已载入史册！');
  renderCalendar();
}

/* ════ 日历修复版 ════ */
function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  // 保留前7个表头
  while(grid.children.length > 7) grid.removeChild(grid.lastChild);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById('cal-month-label').textContent = `${year}年${month+1}月`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const entries = STORAGE.get('entries');
  const today = formatDate(new Date());

  // 填充空白
  for(let i=0; i<firstDay; i++) {
    const d = document.createElement('div'); d.className = 'cal-day other';
    grid.appendChild(d);
  }

  // 填充日期
  for(let i=1; i<=lastDate; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day';
    d.textContent = i;
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    
    if(entries.some(e => e.date === dateStr)) d.classList.add('has-entry');
    if(dateStr === today) d.classList.add('today');
    if(dateStr === currentEditDate) d.style.background = 'var(--paper2)';

    // 核心点击修复
    d.onclick = () => {
      currentEditDate = dateStr;
      updateDateUI(dateStr);
      loadEntryByDate(dateStr);
      switchPage('write', document.querySelector('.nav-btn'));
    };
    grid.appendChild(d);
  }
}

function changeMonth(step) {
  viewDate.setMonth(viewDate.getMonth() + step);
  renderCalendar();
}

function setTheme(t) {
  document.body.className = 'theme-' + t;
}

// 模拟AI生成（实际需接入API）
function generate() {
    const ev = document.getElementById('events').value;
    if(!ev) return alert('请先输入今日见闻');
    document.getElementById('result-wrap').style.display = 'block';
    document.getElementById('result-text').textContent = "（此处对接Claude API）\n今日大雨滂沱，正如《长安十二时辰》中所载，微臣于檐下观雨，偶得考据一则：" + ev;
}

window.onload = init;
</script>
</body>
</html>
