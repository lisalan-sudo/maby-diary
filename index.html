<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<title>人间编年</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

<style>

:root{

  --bg:#faf7f2;
  --paper:#f3ede3;
  --paper2:#ede4d5;

  --ink:#2d2520;
  --ink2:#6b5d54;
  --ink3:#a8978c;

  --rose:#c4748a;
  --rose2:#f5dde4;
  --rose-bg:#fcf3f6;

  --border:#ddd3c5;

  --shadow:
    0 10px 35px rgba(80,60,40,.07);

  --radius:24px;

  --safe-bottom:env(safe-area-inset-bottom);
}

/* 深色 */

body.dark{

  --bg:#171412;
  --paper:#231d19;
  --paper2:#2c241f;

  --ink:#f3ece6;
  --ink2:#d7c5b8;
  --ink3:#9d8a7d;

  --rose:#d98ca3;
  --rose2:#50353d;
  --rose-bg:#302126;

  --border:#3d342e;

  --shadow:
    0 14px 40px rgba(0,0,0,.45);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{

  height:100%;
  overflow:hidden;
}

body{

  height:100%;
  overflow:hidden;

  background:var(--bg);

  color:var(--ink);

  font-family:'Noto Sans SC',sans-serif;

  position:relative;

  -webkit-font-smoothing:antialiased;
}

body::before{

  content:'';

  position:fixed;
  inset:0;

  pointer-events:none;

  opacity:.18;

  background:
    radial-gradient(circle at 20% 20%, rgba(196,116,138,.08), transparent 22%),
    radial-gradient(circle at 80% 75%, rgba(120,90,60,.05), transparent 28%);
}

/* 顶栏 */

header{

  height:68px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 22px;

  position:sticky;
  top:0;
  z-index:100;

  background:rgba(250,247,242,.88);

  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--border);
}

body.dark header{
  background:rgba(23,20,18,.92);
}

.logo-wrap{

  display:flex;
  flex-direction:column;
}

.logo{

  font-family:'Ma Shan Zheng',serif;

  font-size:30px;

  color:var(--rose);

  line-height:1;
}

.logo-sub{

  font-size:11px;

  color:var(--ink3);

  margin-top:4px;

  letter-spacing:1px;
}

.top-actions{

  display:flex;
  gap:10px;
}

.icon-btn{

  border:none;

  background:var(--paper);

  color:var(--ink2);

  border:1px solid var(--border);

  padding:9px 14px;

  border-radius:999px;

  cursor:pointer;

  font-size:13px;

  transition:.2s;
}

.icon-btn:hover{
  transform:translateY(-2px);
}

/* 布局 */

.layout{

  height:calc(100vh - 68px);

  display:grid;

  grid-template-columns:340px 1fr;

  overflow:hidden;
}

@media(max-width:980px){

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{

    position:fixed;

    left:0;
    top:68px;
    bottom:0;

    width:100%;

    z-index:200;

    background:var(--bg);

    transform:translateX(-100%);

    transition:.3s;
  }

  .sidebar.open{
    transform:translateX(0);
  }
}

/* 左侧 */

.sidebar{

  overflow-y:auto;

  border-right:1px solid var(--border);

  padding:18px;

  padding-bottom:calc(30px + var(--safe-bottom));

  -webkit-overflow-scrolling:touch;
}

/* 主体 */

.main{

  overflow-y:auto;

  padding:26px;

  padding-bottom:calc(120px + var(--safe-bottom));

  -webkit-overflow-scrolling:touch;
}

@media(max-width:980px){

  .main{
    padding:18px;
  }
}

/* 卡片 */

.panel,
.card{

  background:var(--paper);

  border:1px solid var(--border);

  border-radius:var(--radius);

  box-shadow:var(--shadow);

  position:relative;

  overflow:hidden;
}

.panel{

  padding:18px;
}

.card{

  padding:24px;
}

.panel + .panel,
.card + .card{
  margin-top:18px;
}

.panel::before,
.card::before{

  content:'';

  position:absolute;
  inset:0;

  background:
    linear-gradient(rgba(255,255,255,.03),rgba(0,0,0,.015));

  pointer-events:none;
}

/* 今日史官 */

.quote-box{

  background:var(--rose-bg);

  border:1px dashed var(--rose);

  border-radius:20px;

  padding:18px;

  margin-bottom:22px;

  position:relative;
}

.quote-label{

  font-size:12px;

  color:var(--rose);

  margin-bottom:10px;

  letter-spacing:1px;
}

.quote-text{

  font-family:'Noto Serif SC',serif;

  line-height:2;

  color:var(--ink2);

  font-size:15px;
}

/* 日期 */

.date-title{

  text-align:center;

  margin-bottom:22px;
}

.date-title h1{

  font-family:'Ma Shan Zheng';

  font-size:46px;

  color:var(--rose);
}

.date-title p{

  margin-top:8px;

  color:var(--ink3);

  font-size:13px;

  letter-spacing:1px;
}

/* 标签 */

.label{

  font-size:13px;

  color:var(--ink2);

  margin-bottom:12px;
}

/* 输入 */

textarea,
input{

  width:100%;

  border:none;

  outline:none;

  background:transparent;

  color:var(--ink);

  font-size:15px;

  line-height:1.95;

  font-family:'Noto Serif SC',serif;
}

textarea{

  resize:vertical;

  min-height:90px;
}

textarea::placeholder,
input::placeholder{
  color:var(--ink3);
}

/* 操作 */

.actions{

  display:flex;

  gap:12px;

  margin-top:20px;
}

.btn{

  flex:1;

  border:none;

  border-radius:18px;

  padding:15px;

  cursor:pointer;

  font-weight:600;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{

  background:var(--rose);

  color:white;
}

.btn-secondary{

  background:var(--paper2);

  color:var(--ink2);
}

/* 日历 */

.calendar-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;
}

.calendar-head h2{

  font-family:'Ma Shan Zheng';

  font-size:30px;

  color:var(--rose);
}

.cal-btn{

  width:34px;
  height:34px;

  border-radius:50%;

  border:none;

  background:var(--bg);

  border:1px solid var(--border);

  color:var(--ink2);

  cursor:pointer;
}

.week-row,
.calendar-grid{

  display:grid;

  grid-template-columns:repeat(7,1fr);

  gap:6px;
}

.week-row{
  margin-bottom:8px;
}

.week-row div{

  text-align:center;

  color:var(--ink3);

  font-size:12px;
}

.day{

  aspect-ratio:1;

  border-radius:12px;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  transition:.18s;

  position:relative;
}

.day:hover{

  background:var(--rose-bg);

  transform:translateY(-2px);
}

.day.empty{
  pointer-events:none;
}

.day.today{
  border:2px solid var(--rose);
}

.day.selected{

  background:var(--rose);

  color:white;

  font-weight:bold;
}

.day.has-entry::after{

  content:'';

  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--rose);

  position:absolute;

  bottom:6px;
}

.day.selected.has-entry::after{
  background:white;
}

/* 搜索 */

.search-results{

  margin-top:14px;

  display:flex;

  flex-direction:column;

  gap:10px;

  max-height:320px;

  overflow:auto;
}

.search-item{

  background:var(--bg);

  border:1px solid var(--border);

  border-radius:16px;

  padding:12px;

  cursor:pointer;
}

.search-item-title{

  color:var(--rose);

  margin-bottom:8px;

  font-weight:700;
}

/* 时间轴 */

.timeline-year{
  margin-top:18px;
}

.timeline-year h3{

  color:var(--rose);

  margin-bottom:8px;
}

.timeline-month{

  padding-left:14px;

  margin-bottom:10px;
}

.timeline-entry{

  font-size:14px;

  color:var(--ink2);

  margin:4px 0;

  cursor:pointer;
}

.timeline-entry:hover{
  color:var(--rose);
}

/* 采风本 */

.material-item{

  background:var(--bg);

  border:1px solid var(--border);

  border-radius:16px;

  padding:14px;

  margin-top:12px;
}

.material-type{

  color:var(--rose);

  font-size:12px;

  margin-bottom:8px;
}

.tag{

  display:inline-block;

  padding:4px 8px;

  border-radius:999px;

  background:var(--rose2);

  color:var(--rose);

  font-size:11px;

  margin-top:8px;

  margin-right:6px;
}

/* 手机底栏 */

.mobile-bar{
  display:none;
}

@media(max-width:980px){

  .mobile-bar{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    background:rgba(250,247,242,.95);

    backdrop-filter:blur(12px);

    border-top:1px solid var(--border);

    display:flex;

    z-index:400;

    padding-bottom:var(--safe-bottom);
  }

  body.dark .mobile-bar{
    background:rgba(23,20,18,.95);
  }

  .mobile-bar button{

    flex:1;

    border:none;

    background:none;

    color:var(--ink2);

    font-size:14px;
  }
}

</style>
</head>

<body>

<header>

  <div class="logo-wrap">

    <div class="logo">人间编年</div>

    <div class="logo-sub">
      不是世界史，而是我的人间史
    </div>

  </div>

  <div class="top-actions">

    <button class="icon-btn" onclick="toggleDark()">
      🌙 夜读
    </button>

    <button class="icon-btn" onclick="exportMarkdown()">
      📜 誊录
    </button>

    <button class="icon-btn" onclick="toggleSidebar()">
      📚 史册
    </button>

  </div>

</header>

<div class="layout">

  <!-- 左侧 -->

  <aside class="sidebar" id="sidebar">

    <!-- 日历 -->

    <div class="panel">

      <div class="calendar-head">

        <button class="cal-btn" onclick="changeMonth(-1)">‹</button>

        <h2 id="monthTitle"></h2>

        <button class="cal-btn" onclick="changeMonth(1)">›</button>

      </div>

      <div class="week-row">

        <div>日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>

      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

    </div>

    <!-- 搜索 -->

    <div class="panel">

      <div style="font-family:'Ma Shan Zheng';font-size:28px;color:var(--rose);margin-bottom:12px;">
        翻检旧档
      </div>

      <input
        id="searchInput"
        placeholder="搜索日期、见闻、脑洞、掌故..."
      />

      <div class="search-results" id="searchResults"></div>

    </div>

    <!-- 时间轴 -->

    <div class="panel">

      <div style="font-family:'Ma Shan Zheng';font-size:28px;color:var(--rose);margin-bottom:12px;">
        编年总目
      </div>

      <div id="timeline"></div>

    </div>

  </aside>

  <!-- 主体 -->

  <main class="main">

    <!-- 今日史官 -->

    <div class="quote-box">

      <div class="quote-label">
        ✦ 今日史官
      </div>

      <div class="quote-text" id="dailyQuote"></div>

    </div>

    <!-- 日期 -->

    <div class="date-title">

      <h1 id="mainDate"></h1>

      <p id="subDate"></p>

    </div>

    <!-- 日记 -->

    <div class="card">

      <div class="label">☀️ 坊间见闻</div>

      <textarea
        id="events"
        placeholder="今日市井之间，有何可记？"
      ></textarea>

    </div>

    <div class="card">

      <div class="label">📚 案头博览</div>

      <textarea
        id="reading"
        placeholder="今日翻阅了哪些卷册？"
      ></textarea>

    </div>

    <div class="card">

      <div class="label">🧊 考据心得</div>

      <textarea
        id="trivia"
        placeholder="记录一则掌故、冷知识……"
      ></textarea>

    </div>

    <div class="card">

      <div class="label">💡 奇思脑洞</div>

      <textarea
        id="brainstorm"
        placeholder="若历史拐向另一条河流……"
      ></textarea>

    </div>

    <div class="card">

      <div class="label">🏷 卷宗标签</div>

      <input
        id="tags"
        placeholder="如：长安, 唐朝, 茶馆, 科举"
      />

    </div>

    <!-- 操作 -->

    <div class="actions">

      <button
        class="btn btn-primary"
        onclick="saveDiary()"
      >
        💾 载入史册
      </button>

      <button
        class="btn btn-secondary"
        onclick="deleteDiary()"
      >
        🔥 焚稿
      </button>

    </div>

    <!-- 采风本 -->

    <div class="card" style="margin-top:28px;">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">

        <div style="font-family:'Ma Shan Zheng';font-size:30px;color:var(--rose);">
          ⭐ 采风本
        </div>

        <button
          class="icon-btn"
          onclick="addMaterial()"
        >
          ＋ 收录
        </button>

      </div>

      <div id="materials"></div>

    </div>

  </main>

</div>

<!-- 手机底栏 -->

<div class="mobile-bar">

  <button onclick="toggleSidebar()">📚 史册</button>

  <button onclick="goToday()">✍️ 今日</button>

  <button onclick="exportMarkdown()">📜 誊录</button>

</div>

<script>

/* =========================================
   今日史官
========================================= */

const QUOTES = [

  "万历十五年无大事，今日亦然。",

  "长安米贵，居大不易，而今日咖啡亦涨价。",

  "史书不会记得今日晚饭吃了什么，但你会。",

  "所谓人生，不过是把寻常日子写成长卷。",

  "这一日看似平淡，日后翻阅，皆成时代切片。",

  "不是所有故事都惊天动地，大多数历史只是生活。",

  "人间烟火气，最抚后来人。",

  "古人记山河，今人记地铁与深夜便利店。",

  "若干年后，今日也会成为旧时代。",

  "真正的编年史，往往写满了寻常日子。",

  "你今日记下的琐事，也许正是未来最珍贵的证词。",

  "人总以为来日方长，却忘了岁月只会翻页。",

  "窗外车流不息，恰如旧时长安夜市。",

  "历史从不是宏大叙事，它只是千万人的今日。",

  "世间多数日子并无大事，而人生恰恰由这些日子组成。",

  "古人有起居注，今人有深夜输入框。",

  "所有未被记下的生活，终将沉入岁月。",

  "所谓个人史，不过是一个人与时代的互相路过。",

  "白居易困于长安，今人困于早高峰。",

  "写下今天，是为了未来某一天重新遇见自己。"
];

function setDailyQuote(){

  const today =
    new Date().toDateString();

  let seed = 0;

  for(let i=0;i<today.length;i++){

    seed += today.charCodeAt(i);
  }

  const quote =
    QUOTES[seed % QUOTES.length];

  document.getElementById('dailyQuote')
    .innerText = quote;
}

/* =========================================
   IndexedDB
========================================= */

const DB_NAME = 'RenjianBianNianDB';

const DB_VERSION = 1;

let db;

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = function(e){

      db = e.target.result;

      if(!db.objectStoreNames.contains('diaries')){

        db.createObjectStore('diaries',{
          keyPath:'date'
        });
      }

      if(!db.objectStoreNames.contains('materials')){

        db.createObjectStore('materials',{
          keyPath:'id',
          autoIncrement:true
        });
      }
    };

    request.onsuccess = function(e){

      db = e.target.result;

      resolve();
    };

    request.onerror = reject;
  });
}

/* =========================================
   日期
========================================= */

const weekNames = [

  '星期日',
  '星期一',
  '星期二',
  '星期三',
  '星期四',
  '星期五',
  '星期六'
];

let selectedDate = new Date();

let currentMonth = new Date();

function formatDate(date){

  const y = date.getFullYear();

  const m =
    String(date.getMonth()+1)
    .padStart(2,'0');

  const d =
    String(date.getDate())
    .padStart(2,'0');

  return `${y}-${m}-${d}`;
}

/* =========================================
   工具
========================================= */

function id(v){
  return document.getElementById(v);
}

function val(v){
  return id(v).value;
}

function setVal(v,t){
  id(v).value = t;
}

/* =========================================
   日期UI
========================================= */

function updateDateUI(){

  id('mainDate').innerHTML =

    `${selectedDate.getFullYear()}年`
    +
    `${selectedDate.getMonth()+1}月`
    +
    `${selectedDate.getDate()}日`;

  id('subDate').innerHTML =
    weekNames[selectedDate.getDay()];
}

/* =========================================
   Diary CRUD
========================================= */

async function saveDiary(){

  const tx =
    db.transaction('diaries','readwrite');

  const store =
    tx.objectStore('diaries');

  store.put({

    date:formatDate(selectedDate),

    updatedAt:Date.now(),

    events:val('events'),

    reading:val('reading'),

    trivia:val('trivia'),

    brainstorm:val('brainstorm'),

    tags:val('tags')
  });

  renderCalendar();

  renderTimeline();

  doSearch();
}

async function loadDiary(){

  const tx =
    db.transaction('diaries','readonly');

  const req =
    tx.objectStore('diaries')
      .get(formatDate(selectedDate));

  req.onsuccess = ()=>{

    const d = req.result || {};

    setVal('events', d.events || '');
    setVal('reading', d.reading || '');
    setVal('trivia', d.trivia || '');
    setVal('brainstorm', d.brainstorm || '');
    setVal('tags', d.tags || '');

    updateDateUI();
  };
}

async function deleteDiary(){

  if(!confirm('确定焚毁此页编年？'))
    return;

  const tx =
    db.transaction('diaries','readwrite');

  tx.objectStore('diaries')
    .delete(formatDate(selectedDate));

  clearInputs();

  renderCalendar();

  renderTimeline();

  doSearch();
}

function clearInputs(){

  [
    'events',
    'reading',
    'trivia',
    'brainstorm',
    'tags'
  ].forEach(v=>setVal(v,''));
}

/* =========================================
   Calendar
========================================= */

async function renderCalendar(){

  const grid =
    id('calendarGrid');

  grid.innerHTML = '';

  const year =
    currentMonth.getFullYear();

  const month =
    currentMonth.getMonth();

  id('monthTitle').innerHTML =
    `${year}年 ${month+1}月`;

  const firstDay =
    new Date(year,month,1).getDay();

  const lastDate =
    new Date(year,month+1,0).getDate();

  const diaryDates =
    await getAllDiaryDates();

  for(let i=0;i<firstDay;i++){

    const empty =
      document.createElement('div');

    empty.className = 'day empty';

    grid.appendChild(empty);
  }

  for(let i=1;i<=lastDate;i++){

    const date =
      new Date(year,month,i);

    const dateStr =
      formatDate(date);

    const div =
      document.createElement('div');

    div.className = 'day';

    div.innerText = i;

    if(dateStr === formatDate(new Date())){

      div.classList.add('today');
    }

    if(dateStr === formatDate(selectedDate)){

      div.classList.add('selected');
    }

    if(diaryDates.includes(dateStr)){

      div.classList.add('has-entry');
    }

    div.onclick = ()=>{

      selectedDate = new Date(date);

      renderCalendar();

      loadDiary();

      if(window.innerWidth < 980){

        toggleSidebar(false);
      }
    };

    grid.appendChild(div);
  }
}

function changeMonth(step){

  currentMonth.setMonth(
    currentMonth.getMonth()+step
  );

  renderCalendar();
}

function goToday(){

  selectedDate = new Date();

  currentMonth = new Date();

  renderCalendar();

  loadDiary();
}

/* =========================================
   Search
========================================= */

async function doSearch(){

  const q =
    id('searchInput')
      .value
      .trim()
      .toLowerCase();

  const wrap =
    id('searchResults');

  wrap.innerHTML = '';

  if(!q) return;

  const all =
    await getAllDiaries();

  const result =
    all.filter(d=>{

      return (

        d.date.includes(q)

        ||

        (d.events || '')
          .toLowerCase()
          .includes(q)

        ||

        (d.reading || '')
          .toLowerCase()
          .includes(q)

        ||

        (d.trivia || '')
          .toLowerCase()
          .includes(q)

        ||

        (d.brainstorm || '')
          .toLowerCase()
          .includes(q)

        ||

        (d.tags || '')
          .toLowerCase()
          .includes(q)
      );
    });

  if(result.length === 0){

    wrap.innerHTML = `
      <div style="color:var(--ink3);font-size:13px;">
        未检索到相关旧档
      </div>
    `;

    return;
  }

  result
    .sort((a,b)=>
      b.date.localeCompare(a.date)
    )
    .forEach(item=>{

      const div =
        document.createElement('div');

      div.className =
        'search-item';

      const preview =

        item.events ||

        item.trivia ||

        item.brainstorm ||

        item.reading ||

        '';

      div.innerHTML = `

        <div class="search-item-title">
          ${item.date}
        </div>

        <div style="line-height:1.8;font-size:14px;color:var(--ink2);">
          ${preview.slice(0,80)}...
        </div>
      `;

      div.onclick = ()=>{

        selectedDate =
          new Date(item.date);

        currentMonth =
          new Date(
            selectedDate.getFullYear(),
            selectedDate.getMonth(),
            1
          );

        renderCalendar();

        loadDiary();
      };

      wrap.appendChild(div);
    });
}

/* =========================================
   Timeline
========================================= */

async function renderTimeline(){

  const wrap =
    id('timeline');

  wrap.innerHTML = '';

  const all =
    await getAllDiaries();

  const grouped = {};

  all.forEach(d=>{

    const [year,month] =
      d.date.split('-');

    if(!grouped[year])
      grouped[year] = {};

    if(!grouped[year][month])
      grouped[year][month] = [];

    grouped[year][month]
      .push(d);
  });

  Object.keys(grouped)
    .sort((a,b)=>b-a)
    .forEach(year=>{

      const yearDiv =
        document.createElement('div');

      yearDiv.className =
        'timeline-year';

      yearDiv.innerHTML =
        `<h3>${year}</h3>`;

      Object.keys(grouped[year])
        .sort((a,b)=>b-a)
        .forEach(month=>{

          const monthDiv =
            document.createElement('div');

          monthDiv.className =
            'timeline-month';

          monthDiv.innerHTML =
            `<div style="margin-bottom:6px;color:var(--ink2);">${month}月</div>`;

          grouped[year][month]
            .sort((a,b)=>
              b.date.localeCompare(a.date)
            )
            .forEach(item=>{

              const entry =
                document.createElement('div');

              entry.className =
                'timeline-entry';

              entry.innerHTML =
                `· ${item.date}`;

              entry.onclick = ()=>{

                selectedDate =
                  new Date(item.date);

                currentMonth =
                  new Date(
                    selectedDate.getFullYear(),
                    selectedDate.getMonth(),
                    1
                  );

                renderCalendar();

                loadDiary();
              };

              monthDiv.appendChild(entry);
            });

          yearDiv.appendChild(monthDiv);
        });

      wrap.appendChild(yearDiv);
    });
}

/* =========================================
   Export Markdown
========================================= */

async function exportMarkdown(){

  const all =
    await getAllDiaries();

  all.sort((a,b)=>
    a.date.localeCompare(b.date)
  );

  let md =
`# 人间编年

不是世界史，而是我的人间史。

`;

  all.forEach(d=>{

    md += `# ${d.date}

## 坊间见闻
${d.events || ''}

## 案头博览
${d.reading || ''}

## 考据心得
${d.trivia || ''}

## 奇思脑洞
${d.brainstorm || ''}

## 卷宗标签
${d.tags || ''}

---

`;
  });

  const blob =
    new Blob([md],{
      type:'text/markdown'
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href = url;

  a.download =
    `人间编年_${Date.now()}.md`;

  a.click();

  URL.revokeObjectURL(url);
}

/* =========================================
   Materials
========================================= */

async function addMaterial(){

  const type =
    prompt('类型（词句 / 掌故 / 地名 / 人物）');

  if(!type) return;

  const content =
    prompt('内容');

  if(!content) return;

  const source =
    prompt('出处');

  const tags =
    prompt('标签（逗号分隔）');

  const tx =
    db.transaction('materials','readwrite');

  tx.objectStore('materials')
    .add({

      type,
      content,
      source,
      tags
    });

  renderMaterials();
}

async function renderMaterials(){

  const wrap =
    id('materials');

  wrap.innerHTML = '';

  const tx =
    db.transaction('materials','readonly');

  const req =
    tx.objectStore('materials')
      .getAll();

  req.onsuccess = ()=>{

    const arr =
      req.result.reverse();

    if(arr.length === 0){

      wrap.innerHTML = `
        <div style="color:var(--ink3);">
          尚无采风记录
        </div>
      `;

      return;
    }

    arr.forEach(item=>{

      const div =
        document.createElement('div');

      div.className =
        'material-item';

      div.innerHTML = `

        <div class="material-type">
          ${item.type}
        </div>

        <div style="line-height:1.9;">
          ${item.content}
        </div>

        <div style="margin-top:8px;color:var(--ink3);font-size:13px;">
          ${item.source || ''}
        </div>

        ${
          (item.tags || '')
          .split(',')
          .filter(Boolean)
          .map(t=>
            `<span class="tag">${t}</span>`
          )
          .join('')
        }
      `;

      wrap.appendChild(div);
    });
  };
}

========================================= */

function toggleSidebar(force){

  const s =
    id('sidebar');

  if(typeof force === 'boolean'){

    s.classList.toggle('open', force);

  }else{

    s.classList.toggle('open');
  }
}

/* =========================================
   DB Helpers
========================================= */

async function getAllDiaries(){

  return new Promise(resolve=>{

    const tx =
      db.transaction('diaries','readonly');

    const req =
      tx.objectStore('diaries')
        .getAll();

    req.onsuccess =
      ()=>resolve(req.result || []);
  });
}

async function getAllDiaryDates(){

  const all =
    await getAllDiaries();

  return all.map(d=>d.date);
}
