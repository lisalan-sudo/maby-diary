<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>马伯庸日记 · 起居注</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#faf7f2;
  --paper:#f3ede3;
  --paper2:#ede4d5;
  --ink:#2d2520;
  --ink2:#6b5d54;
  --ink3:#a8978c;
  --rose:#c4748a;
  --rose-light:#f3d9e1;
  --rose-bg:#fcf3f6;
  --border:#ddd3c5;
  --shadow:0 10px 30px rgba(80,60,40,.08);
  --radius:16px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Noto Sans SC',sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* 背景纸张纹理 */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.25;
  background:
    radial-gradient(circle at 20% 20%, rgba(196,116,138,.08), transparent 25%),
    radial-gradient(circle at 80% 70%, rgba(180,140,100,.05), transparent 30%);
}

/* 顶栏 */
header{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  background:rgba(250,247,242,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.logo{
  font-family:'Ma Shan Zheng',serif;
  font-size:26px;
  color:var(--rose);
  letter-spacing:1px;
}

.today-btn{
  border:none;
  background:var(--paper);
  color:var(--ink2);
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  border:1px solid var(--border);
}

/* 主体 */
.container{
  max-width:1200px;
  margin:auto;
  padding:24px;
  display:grid;
  grid-template-columns:320px 1fr;
  gap:24px;
}

@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
}

/* 左侧日历 */
.sidebar{
  position:sticky;
  top:86px;
  height:fit-content;
}

.panel{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.panel::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.03),rgba(0,0,0,.02));
  pointer-events:none;
}

/* 月份头 */
.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.calendar-head h2{
  font-family:'Ma Shan Zheng';
  font-size:28px;
  color:var(--rose);
}

.cal-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:var(--cream);
  border:1px solid var(--border);
  color:var(--ink2);
}

.week-row,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.week-row{
  margin-bottom:10px;
}

.week-row div{
  text-align:center;
  color:var(--ink3);
  font-size:12px;
}

.day{
  aspect-ratio:1;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  position:relative;
  transition:.2s;
  user-select:none;
}

.day:hover{
  background:var(--rose-bg);
  transform:translateY(-2px);
}

.day.empty{
  pointer-events:none;
}

.day.today{
  border:2px solid var(--rose);
}

.day.selected{
  background:var(--rose);
  color:white;
  font-weight:bold;
}

.day.has-entry::after{
  content:'';
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--rose);
  position:absolute;
  bottom:6px;
}

.day.selected.has-entry::after{
  background:white;
}

/* 编辑区域 */
.editor{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.date-title{
  text-align:center;
  margin-bottom:8px;
}

.date-title h1{
  font-family:'Ma Shan Zheng';
  font-size:42px;
  color:var(--rose);
}

.date-title p{
  color:var(--ink3);
  margin-top:6px;
}

.card{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.03),rgba(0,0,0,.015));
  pointer-events:none;
}

.label{
  font-size:13px;
  margin-bottom:10px;
  color:var(--ink2);
}

textarea,
input{
  width:100%;
  border:none;
  resize:none;
  background:transparent;
  outline:none;
  font-size:15px;
  line-height:1.9;
  color:var(--ink);
  font-family:'Noto Serif SC',serif;
}

textarea::placeholder,
input::placeholder{
  color:var(--ink3);
}

/* 按钮 */
.actions{
  display:flex;
  gap:12px;
}

.btn{
  flex:1;
  border:none;
  border-radius:16px;
  padding:14px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:.2s;
}

.btn-save{
  background:var(--rose);
  color:white;
}

.btn-save:hover{
  transform:translateY(-2px);
}

.btn-clear{
  background:var(--paper2);
  color:var(--ink2);
}

/* 历史预览 */
.history-list{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:18px;
}

.history-item{
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.history-item-title{
  color:var(--rose);
  font-weight:600;
  margin-bottom:8px;
}

.empty-tip{
  text-align:center;
  color:var(--ink3);
  padding:30px 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">📖 马伯庸日记</div>
  <button class="today-btn" onclick="goToday()">回到今日</button>
</header>

<div class="container">

  <!-- 左侧 -->
  <aside class="sidebar">

    <div class="panel">

      <div class="calendar-head">
        <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="cal-btn" onclick="changeMonth(1)">›</button>
      </div>

      <div class="week-row">
        <div>日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

    </div>

    <div class="panel" style="margin-top:18px;">
      <div style="font-family:'Ma Shan Zheng';font-size:24px;color:var(--rose);margin-bottom:12px;">
        编年摘录
      </div>

      <div id="historyList" class="history-list"></div>
    </div>

  </aside>

  <!-- 右侧 -->
  <main class="editor">

    <div class="date-title">
      <h1 id="mainDate"></h1>
      <p id="subDate"></p>
    </div>

    <div class="card">
      <div class="label">☀️ 坊间见闻</div>
      <textarea id="events" rows="5" placeholder="今日街谈巷议，有何可记之事？"></textarea>
    </div>

    <div class="card">
      <div class="label">📚 案头博览</div>
      <textarea id="reading" rows="4" placeholder="翻阅了哪些卷册？"></textarea>
    </div>

    <div class="card">
      <div class="label">🧊 考据心得</div>
      <textarea id="trivia" rows="3" placeholder="记录一则冷僻掌故……"></textarea>
    </div>

    <div class="card">
      <div class="label">💡 奇思脑洞</div>
      <textarea id="brainstorm" rows="3" placeholder="若历史拐向另一条河流……"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-save" onclick="saveDiary()">💾 载入史册</button>
      <button class="btn btn-clear" onclick="clearDiary()">🗑 焚稿重写</button>
    </div>

  </main>

</div>

<script>
/* =========================================
   数据层
========================================= */

const STORAGE_KEY = 'maboyong_diary_v2';

function getData(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
}

function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* =========================================
   日期
========================================= */

const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

let selectedDate = new Date();
let currentMonth = new Date();

function formatDate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function updateDateTitle(){

  const d = selectedDate;

  document.getElementById('mainDate').innerHTML =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

  document.getElementById('subDate').innerHTML =
    weekNames[d.getDay()];
}

/* =========================================
   日历
========================================= */

function renderCalendar(){

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  document.getElementById('monthTitle').innerHTML =
    `${year}年 ${month+1}月`;

  const firstDay = new Date(year, month, 1).getDay();

  const lastDate = new Date(year, month+1, 0).getDate();

  const diaryData = getData();

  // 空白
  for(let i=0;i<firstDay;i++){
    const div = document.createElement('div');
    div.className = 'day empty';
    grid.appendChild(div);
  }

  // 日期
  for(let i=1;i<=lastDate;i++){

    const date = new Date(year, month, i);
    const dateStr = formatDate(date);

    const div = document.createElement('div');

    div.className = 'day';
    div.innerText = i;

    // 今日
    if(dateStr === formatDate(new Date())){
      div.classList.add('today');
    }

    // 选中
    if(dateStr === formatDate(selectedDate)){
      div.classList.add('selected');
    }

    // 有日记
    if(diaryData[dateStr]){
      div.classList.add('has-entry');
    }

    div.onclick = () => {

      selectedDate = new Date(year, month, i);

      renderCalendar();

      loadDiary();

      updateDateTitle();
    };

    grid.appendChild(div);
  }
}

function changeMonth(step){

  currentMonth.setMonth(currentMonth.getMonth() + step);

  renderCalendar();
}

function goToday(){

  selectedDate = new Date();
  currentMonth = new Date();

  renderCalendar();

  loadDiary();

  updateDateTitle();
}

/* =========================================
   日记
========================================= */

function loadDiary(){

  const data = getData();

  const dateStr = formatDate(selectedDate);

  const diary = data[dateStr] || {
    events:'',
    reading:'',
    trivia:'',
    brainstorm:''
  };

  document.getElementById('events').value = diary.events;
  document.getElementById('reading').value = diary.reading;
  document.getElementById('trivia').value = diary.trivia;
  document.getElementById('brainstorm').value = diary.brainstorm;

  renderHistory();
}

function saveDiary(){

  const data = getData();

  const dateStr = formatDate(selectedDate);

  data[dateStr] = {

    date:dateStr,

    updatedAt:Date.now(),

    events:document.getElementById('events').value,

    reading:document.getElementById('reading').value,

    trivia:document.getElementById('trivia').value,

    brainstorm:document.getElementById('brainstorm').value
  };

  saveData(data);

  renderCalendar();

  renderHistory();

  alert('已载入史册');
}

function clearDiary(){

  if(!confirm('确定焚毁此页起居注？')) return;

  const data = getData();

  delete data[formatDate(selectedDate)];

  saveData(data);

  loadDiary();

  renderCalendar();
}

/* =========================================
   历史
========================================= */

function renderHistory(){

  const wrap = document.getElementById('historyList');

  const data = getData();

  const arr = Object.values(data)
    .sort((a,b)=>b.updatedAt-a.updatedAt)
    .slice(0,6);

  if(arr.length === 0){

    wrap.innerHTML = `
      <div class="empty-tip">
        尚无史册
      </div>
    `;

    return;
  }

  wrap.innerHTML = '';

  arr.forEach(item=>{

    const div = document.createElement('div');

    div.className = 'history-item';

    const preview =
      item.events ||
      item.reading ||
      item.trivia ||
      item.brainstorm ||
      '';

    div.innerHTML = `
      <div class="history-item-title">${item.date}</div>
      <div style="color:var(--ink2);line-height:1.8;font-size:14px;">
        ${preview.substring(0,60)}...
      </div>
    `;

    div.onclick = ()=>{

      const d = new Date(item.date);

      selectedDate = d;

      currentMonth = new Date(d.getFullYear(), d.getMonth(), 1);

      renderCalendar();

      loadDiary();

      updateDateTitle();

      window.scrollTo({
        top:0,
        behavior:'smooth'
      });
    };

    wrap.appendChild(div);
  });
}

/* =========================================
   自动保存
========================================= */

let autoSaveTimer = null;

['events','reading','trivia','brainstorm'].forEach(id=>{

  document.getElementById(id).addEventListener('input', ()=>{

    clearTimeout(autoSaveTimer);

    autoSaveTimer = setTimeout(()=>{

      saveDiary();

    }, 1200);
  });
});

/* =========================================
   初始化
========================================= */

function init(){

  updateDateTitle();

  renderCalendar();

  loadDiary();
}

init();

</script>

</body>
</html>
