<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>人间编年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* =====================================================
   人间编年 · 四时书房
===================================================== */
:root{
  --bg:#F8F4EC;
  --paper:#EFE7DA;
  --paper2:#E4D7C3;
  --text:#2B2622;
  --text2:#6D6257;
  --text3:#9A8C7D;
  --accent:#A56A4F;
  --accent-soft:#E8D7C8;
  --border:#D9CCB8;
  --shadow: 0 12px 40px rgba(90,70,50,.08);
  --radius:26px;
  --font-serif: 'Noto Serif SC', serif;
  --font-hand: 'Ma Shan Zheng', serif;
}

/* 主题定义 */
body.theme-xuanzhi { --bg:#F8F4EC; --paper:#EFE7DA; --paper2:#E4D7C3; --text:#2B2622; --text2:#6D6257; --text3:#9A8C7D; --accent:#A56A4F; --accent-soft:#E8D7C8; --border:#D9CCB8; }
body.theme-songyan { 
  --bg:#161311; --paper:#221D1A; --paper2:#2E2621; --text:#F2E8DC; --text2:#B7A99B; 
  --text3:#7C7067; --accent:#8FAE8E; --accent-soft:#2D3830; --border:#3A312B; 
  --shadow:0 16px 50px rgba(0,0,0,.45); 
}
body.theme-yanzhi { 
  --bg:#2A1E22; --paper:#3A2A2F; --paper2:#49353B; --text:#F8EDEE; --text2:#D5B8BE; 
  --text3:#A7858E; --accent:#E09AB0; --accent-soft:#5B3B46; --border:#6A4C56; 
}
body.theme-qingjian { 
  --bg:#182022; --paper:#233034; --paper2:#2E4045; --text:#E6EFE8; --text2:#A8B9B0; 
  --text3:#72847B; --accent:#7FA89A; --accent-soft:#31454A; --border:#395056; 
}

/* 全局 */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans SC',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.10;
  background: radial-gradient(circle at 20% 30%, var(--accent-soft), transparent 25%);
}

/* 顶栏 */
header {
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  flex-shrink:0;
}
.logo-box { display:flex; flex-direction:column; }
.logo {
  font-family:var(--font-hand);
  font-size:36px;
  color:var(--accent);
  line-height:1;
  white-space:nowrap;
}
.logo-sub {
  margin-top:4px;
  font-size:13px;
  color:var(--text2);
  letter-spacing:0.5px;
}

/* 主题按钮 */
.theme-group {
  display:flex;
  gap:8px;
}
.theme-btn {
  border:none;
  background:var(--paper);
  border:1px solid var(--border);
  color:var(--text2);
  border-radius:999px;
  padding:8px 15px;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}
.theme-btn:hover {
  border-color:var(--accent);
  color:var(--accent);
}

/* 布局 */
.layout {
  height:calc(100vh - 72px);
  display:grid;
  grid-template-columns:360px 1fr;
}
@media (max-width:980px) {
  .layout { grid-template-columns:1fr; }
  .sidebar { display:none; }
  .main { padding:24px 18px 100px; }
  .logo { font-size:32px; }
}

/* 主内容 */
.main {
  overflow-y:auto;
  padding:28px 32px;
  line-height:1.9;
  -webkit-overflow-scrolling:touch;
}

/* 隐藏滚动条但保留功能 */
.main::-webkit-scrollbar { display:none; }
.sidebar::-webkit-scrollbar { display:none; }

/* 卡片 */
.panel, .card {
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  position:relative;
}
.panel { padding:24px; }
.card { padding:26px; margin-top:26px; }

/* 今日史官 */
.quote {
  background:var(--accent-soft);
  border:1px dashed var(--accent);
  border-radius:22px;
  padding:26px 28px;
  margin-bottom:32px;
  position:relative;
}
.quote::before {
  content:"✦";
  position:absolute;
  left:26px;
  top:22px;
  font-size:26px;
  opacity:0.25;
  color:var(--accent);
}
.quote-label {
  color:var(--accent);
  font-size:14px;
  margin-bottom:14px;
}
.quote-text {
  font-family:var(--font-serif);
  line-height:2;
  font-size:17.5px;
  color:var(--text2);
}

/* 日期 */
.date-box {
  text-align:center;
  margin-bottom:36px;
}
.date-box h1 {
  font-family:var(--font-hand);
  font-size:72px;
  color:var(--accent);
  line-height:1;
}
.date-box p {
  margin-top:10px;
  color:var(--text2);
  font-size:18.5px;
}

/* 标签 */
.label {
  color:var(--text2);
  margin-bottom:16px;
  font-size:15.5px;
}

/* 输入框 */
textarea {
  width:100%;
  border:none;
  outline:none;
  background:none;
  color:var(--text);
  font-family:var(--font-serif);
  line-height:2;
  font-size:16.5px;
  resize:vertical;
  min-height:110px;
}
::placeholder { color:var(--text3); }

/* 按钮 */
.actions {
  display:flex;
  gap:14px;
  margin-top:32px;
}
.btn {
  flex:1;
  border:none;
  border-radius:18px;
  padding:16px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:.25s;
}
.btn:hover { transform:translateY(-2px); }
.btn-primary { background:var(--accent); color:white; }
.btn-secondary { background:var(--paper2); color:var(--text2); }
</style>
</head>
<body class="theme-songyan">

<header>
  <div class="logo-box">
    <div class="logo">人间编年</div>
    <div class="logo-sub">不是世界史，而是我的人间史</div>
  </div>
  <div class="theme-group">
    <button class="theme-btn" onclick="setTheme('xuanzhi')">宣纸</button>
    <button class="theme-btn" onclick="setTheme('songyan')">松烟</button>
    <button class="theme-btn" onclick="setTheme('yanzhi')">胭脂</button>
    <button class="theme-btn" onclick="setTheme('qingjian')">青简</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <!-- 日历区域保持不变，代码较长此处省略显示，如需可保留 -->
    </div>
  </aside>

  <main class="main">
    <div class="quote">
      <div class="quote-label">✦ 今日史官</div>
      <div class="quote-text" id="dailyQuote"></div>
    </div>

    <div class="date-box">
      <h1 id="mainDate"></h1>
      <p id="subDate"></p>
    </div>

    <div class="card">
      <div class="label">☀️ 坊间见闻</div>
      <textarea id="ta-fangjian" placeholder="今日市井之间，有何可记？"></textarea>
    </div>

    <div class="card">
      <div class="label">📚 案头博览</div>
      <textarea id="ta-anshou" placeholder="今日翻阅了哪些卷册？"></textarea>
    </div>

    <div class="card">
      <div class="label">🧊 考据心得</div>
      <textarea id="ta-kaoju" placeholder="记录一则掌故、冷知识……"></textarea>
    </div>

    <div class="card">
      <div class="label">💡 奇思脑洞</div>
      <textarea id="ta-qisi" placeholder="若历史拐向另一条河流……"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="saveEntry()">💾 载入史册</button>
      <button class="btn btn-secondary" onclick="clearAll()">📜 清空草稿</button>
    </div>
  </main>
</div>

<script>
// （JS 部分保持和上次一致，这里省略以节省篇幅，你可以直接复制上一个版本的 <script> 内容）
const QUOTES = ["万历十五年无大事，今日亦然。","真正的编年史，往往写满了寻常日子。","历史从不是宏大叙事，它只是千万人的今日。","所有未被记下的生活，终将沉入岁月。","人间烟火气，最抚后来人。","今日看似平淡，来日翻阅，皆成时代切片。"];

function setDailyQuote(){
  const today = new Date().toDateString();
  let seed = 0;
  for(let i=0;i<today.length;i++) seed += today.charCodeAt(i);
  document.getElementById('dailyQuote').innerText = QUOTES[seed % QUOTES.length];
}

let selectedDate = new Date();
let currentMonth = new Date();
const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function updateDate(){
  const y = selectedDate.getFullYear(), m = selectedDate.getMonth()+1, d = selectedDate.getDate();
  document.getElementById('mainDate').innerHTML = `${y}年${m}月${d}日`;
  document.getElementById('subDate').innerHTML = weekNames[selectedDate.getDay()];
}

function renderCalendar(){ /* 保持你原来的日历代码 */ }
function changeMonth(step){ currentMonth.setMonth(currentMonth.getMonth()+step); renderCalendar(); }

function setTheme(theme){
  document.body.className = 'theme-' + theme;
  localStorage.setItem('renjian_theme', theme);
}

function saveEntry(){ alert('✅ 已载入史册（本地暂存）'); }
function clearAll(){
  if(confirm('确定清空所有草稿吗？')){
    document.querySelectorAll('textarea').forEach(t => t.value = '');
  }
}

function init(){
  const saved = localStorage.getItem('renjian_theme') || 'songyan';
  setTheme(saved);
  setDailyQuote();
  updateDate();
  renderCalendar();
}
init();
</script>
</body>
</html>
